version: 2
updates:
  # ทุกอย่างรวมเป็น 1 PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns:
          - "*"

  # minor + patch = 1 PR · major = 1 PR ต่อ hook
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      pre-commit-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
